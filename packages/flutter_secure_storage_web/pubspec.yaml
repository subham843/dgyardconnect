name: flutter_secure_storage_web
description: WASM-compatible flutter_secure_storage web implementation for DG Yard Connect.
version: 1.2.1
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^1.1.2
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.0

flutter:
  plugin:
    implements: flutter_secure_storage
    platforms:
      web:
        pluginClass: FlutterSecureStorageWeb
        fileName: flutter_secure_storage_web.dart
