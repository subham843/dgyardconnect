## NOTE: This machine has ~8GB RAM. -Xmx8G can crash the Gradle daemon (native mmap OOM).
## Keep heap smaller so native memory can grow.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true

# Disable Kotlin incremental compilation to avoid "different roots" error when
# project (E:) and Pub cache (C:) are on different drives on Windows
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
